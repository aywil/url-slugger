services:
  pg:
    image: postgres
    environment:
      POSTGRES_DB: shortlinks
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "6432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d shortlinks" ]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  pgdata: